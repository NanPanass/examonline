<!DOCTYPE html>

  "borderRadius": { "DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px" },
  "spacing": { "gutter":"1.5rem","space-xl":"2.5rem","space-md":"1rem","space-sm":"0.5rem","gutter-mobile":"1rem","space-xs":"0.25rem","margin-mobile":"1rem","margin":"2rem","space-lg":"1.5rem" },

    "body-sm":["Inter","Noto Sans Thai","sans-serif"],"headline-xl":["Plus Jakarta Sans","Noto Sans Thai","sans-serif"],

<style>
@layer base { html, body { margin: 0; padding: 0; } body { overscroll-behavior: none; font-variant-numeric: tabular-nums; } }
html { scroll-padding-top: calc(112px + env(safe-area-inset-top, 0px)); }
.material-symbols-outlined { font-size: 20px; line-height: 1; vertical-align: middle; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; user-select: none; }
.material-symbols-outlined.fill { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
.nosb::-webkit-scrollbar { display: none; } .nosb { scrollbar-width: none; }

/* ---------- Answer tile (DESIGN.md: Answer Selection) ---------- */
.opt { display:flex; align-items:center; gap:.75rem; min-height:52px; padding:.75rem 1rem; border:1.5px solid #E2E8F0; border-radius:.5rem; background:#fff; cursor:pointer; margin-bottom:.625rem; transition:box-shadow .15s, border-color .15s, background .15s; }
.opt:hover { border-color:#CBD5E1; box-shadow:0 2px 4px -1px rgba(15,23,42,.04), 0 4px 6px -1px rgba(15,23,42,.06); }
.opt .ind { width:20px; height:20px; border-radius:9999px; border:2px solid #94A3B8; flex:none; display:grid; place-items:center; }
.opt:has(input:checked) { border-color:#1E40AF; background:#EFF6FF; box-shadow:0 0 0 4px rgba(37,99,235,.15); }
.opt:has(input:checked) .ind { border-color:#1E40AF; background:#1E40AF; }
.opt:has(input:checked) .ind::after { content:''; width:8px; height:8px; border-radius:9999px; background:#fff; }
.opt:has(input:focus-visible) { outline:2px solid #2563EB; outline-offset:2px; }
.opt.ok { border-color:#0D9488; background:#F0FDFA; box-shadow:none; }
.opt.bad { border-color:#BA1A1A; background:#FFF1F0; box-shadow:none; }
.opt .lt { width:24px; height:24px; border-radius:9999px; background:#EAEDFF; color:#444653; display:grid; place-items:center; flex:none; font-size:12px; font-weight:600; }
.opt img.th { width:64px; height:64px; object-fit:cover; border-radius:.5rem; flex:none; }
.opt.locked { cursor:default; } .opt.locked:hover { box-shadow:none; }

/* ---------- Question palette (DESIGN.md: Question Palette) ---------- */
.qp { width:36px; height:36px; border-radius:9999px; border:1px solid #E2E8F0; background:#F8FAFC; color:#64748B; font:600 .8rem/1 Inter,'Noto Sans Thai',sans-serif; flex:none; cursor:pointer; }
.qp.ans { background:#0D9488; border-color:#0D9488; color:#fff; }
.qp.fl { background:#F59E0B; border-color:#F59E0B; color:#fff; }
.qp.cur { background:#EFF6FF; border:2px solid #1E40AF; color:#1E40AF; }
.qp:focus-visible { outline:2px solid #2563EB; outline-offset:2px; }

/* ---------- Timer (DESIGN.md: Assessment Timer) ---------- */
.tpill { display:inline-flex; align-items:center; gap:.375rem; padding:.375rem .875rem; border-radius:9999px; background:#F1F5F9; color:#0F172A; font-weight:600; font-variant-numeric:tabular-nums; }
.tpill.warn { background:#FEE2E2; color:#991B1B; animation:tpulse 1.6s ease-in-out infinite; }
@keyframes tpulse { 50% { opacity:.7; } }

/* ---------- Dropzone (DESIGN.md: Upload Dropzone) ---------- */
.dz { min-height:180px; border:1.5px dashed #94A3B8; background:#F8FAFC; border-radius:.75rem; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.5rem; text-align:center; padding:1.5rem; cursor:pointer; transition:background .15s, border-color .15s; }
.dz:hover, .dz.over { background:#EFF6FF; border-color:#2563EB; }
.dz:focus-visible { outline:2px solid #2563EB; outline-offset:2px; }

/* ---------- Live room answer tiles ---------- */
.lt-tile { display:flex; align-items:center; gap:.75rem; min-height:88px; padding:1rem; border:1.5px solid #E2E8F0; border-radius:.75rem; background:#fff; text-align:left; font:inherit; cursor:pointer; transition:box-shadow .15s, border-color .15s; }
.lt-tile:hover { border-color:#1E40AF; box-shadow:0 4px 6px -1px rgba(15,23,42,.08); }
.lt-tile:disabled { opacity:.55; cursor:default; }
.lt-tile .bd { width:40px; height:40px; border-radius:.5rem; display:grid; place-items:center; flex:none; color:#fff; font-weight:700; }
.lt-tile img { width:52px; height:52px; object-fit:cover; border-radius:.5rem; flex:none; }

table { width:100%; border-collapse:collapse; }
.tw { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.tw th, .tw td { text-align:left; padding:.75rem .5rem; border-bottom:1px solid #E2E8F0; font-size:14px; vertical-align:top; white-space:nowrap; }
.tw td.wrap { white-space:normal; }
.tw th { color:#444653; font-weight:600; font-size:12px; }

@media (prefers-reduced-motion: reduce) { .tpill.warn { animation:none; } * { transition:none !important; } }
@media print {
  header, footer, .noprint, #toasts { display:none !important; }
  main { padding-top:0 !important; }
  body { background:#fff; }
  .shadow-sm { box-shadow:none !important; }
  .brk { break-inside:avoid; }
}
</style>
</head>
<body class="bg-background text-on-surface font-body-md text-body-md min-h-screen flex flex-col">
<div id="app" class="flex-1 flex flex-col"></div>
<div id="toasts" class="fixed left-1/2 -translate-x-1/2 z-[80] flex flex-col items-center gap-2" style="bottom:calc(24px + env(safe-area-inset-bottom,0px))"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
